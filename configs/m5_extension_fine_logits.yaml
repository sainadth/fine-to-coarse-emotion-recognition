# Extension: e_t = [h_t ; p_t^f] -> UTE (Stage-I 27-class head kept, frozen)
run_name: M5_fine_logits_ext
system: M5
base_model: roberta-base
from_stage1: checkpoints/stage1_goemotions
use_ute: true
view: dialogue
seed: 42
epochs: 6
batch_size: 4
eval_batch_size: 8
learning_rate: 1.0e-5
head_learning_rate: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.1
max_length: 64
max_turns: 24
dropout: 0.1
ute_layers: 2
ute_heads: 8
ute_ff: 2048
ute_dropout: 0.1
freeze_backbone: false
use_fine_logits: true
speaker_aware: false
class_weighted_loss: false
device: auto
num_workers: 2
amp: true
