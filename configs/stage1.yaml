# Stage I: RoBERTa-base -> GoEmotions (27 fine-grained classes, neutral excluded)
run_name: stage1_goemotions
model_name: roberta-base
seed: 42
epochs: 4
batch_size: 32
eval_batch_size: 64
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.06
max_length: 64
dropout: 0.1
multilabel_policy: single   # "single" keeps single-label examples, "first" takes the first label
grad_clip: 1.0
device: auto
num_workers: 2
amp: true
